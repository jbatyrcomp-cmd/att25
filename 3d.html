<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAN 3D Simulyator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B0E14;
    --panel: #121826;
    --panel-2: #171F30;
    --line: #253048;
    --ink: #E7ECF6;
    --ink-dim: #8B97AE;
    --accent: #FFB454;
    --wired: #6FE3C4;
    --wireless: #4FC7E8;
    --wan: #FF8C4B;
    --danger: #E8607A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:100%; height:100%; overflow:hidden; background:var(--bg); font-family:'Manrope',sans-serif; color:var(--ink);}
  #scene{position:fixed; inset:0; display:block; touch-action:none;}
  #labels{position:fixed; inset:0; pointer-events:none; z-index:5;}
  .devlabel{
    position:absolute; transform:translate(-50%,-100%); white-space:nowrap;
    font-size:12px; font-weight:600; padding:3px 9px 3px 7px; border-radius:20px;
    background:rgba(18,24,38,.82); border:1px solid var(--line); color:var(--ink);
    display:flex; align-items:center; gap:6px; backdrop-filter:blur(3px);
  }
  .devlabel .dot{width:6px; height:6px; border-radius:50%; flex:none;}
  .devlabel .ip{font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--ink-dim);}

  /* Toolbar */
  #toolbar{
    position:fixed; top:16px; left:16px; right:16px; z-index:20;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  #brand{display:flex; flex-direction:column; margin-right:6px;}
  #brand b{font-size:15px; font-weight:800; letter-spacing:.2px;}
  #brand span{font-size:11px; color:var(--ink-dim);}
  #devtray{
    display:flex; gap:6px; background:var(--panel); border:1px solid var(--line);
    padding:6px; border-radius:14px; flex-wrap:wrap;
  }
  .devbtn{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    width:60px; padding:7px 4px 6px; border-radius:10px; border:1px solid transparent;
    background:transparent; color:var(--ink-dim); cursor:pointer; transition:.15s;
  }
  .devbtn svg{width:22px; height:22px; stroke:var(--ink); fill:none; stroke-width:1.6;}
  .devbtn span{font-size:10px; font-weight:600; color:var(--ink-dim);}
  .devbtn:hover{background:var(--panel-2); border-color:var(--line); transform:translateY(-1px);}
  .devbtn:active{transform:translateY(0);}

  #actions{display:flex; gap:8px; margin-left:auto;}
  .actbtn{
    display:flex; align-items:center; gap:7px; padding:10px 14px; border-radius:12px;
    background:var(--panel); border:1px solid var(--line); color:var(--ink);
    font-family:'Manrope',sans-serif; font-size:13px; font-weight:600; cursor:pointer; transition:.15s;
  }
  .actbtn svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8;}
  .actbtn:hover{border-color:#3A4763;}
  .actbtn.on{background:var(--accent); color:#1A1204; border-color:var(--accent);}
  .actbtn.warn:hover{border-color:var(--danger); color:var(--danger);}

  /* Panel */
  #panel{
    position:fixed; top:16px; right:16px; bottom:16px; width:280px; z-index:22;
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:18px; display:none; flex-direction:column; gap:14px; overflow-y:auto;
  }
  #panel.show{display:flex;}
  #panel .ptop{display:flex; justify-content:space-between; align-items:flex-start;}
  #panel h2{font-size:16px; font-weight:800;}
  #panel .type{font-size:11px; color:var(--ink-dim); margin-top:2px; text-transform:uppercase; letter-spacing:.6px;}
  #panel .xbtn{background:none; border:none; color:var(--ink-dim); cursor:pointer; font-size:18px; line-height:1;}
  #panel .xbtn:hover{color:var(--ink);}
  #panel label{font-size:11px; color:var(--ink-dim); display:block; margin-bottom:5px;}
  #panel input[type=text]{
    width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:9px;
    padding:9px 10px; color:var(--ink); font-family:'Manrope',sans-serif; font-size:13px;
  }
  #panel input[type=text]:focus{outline:none; border-color:var(--accent);}
  .mono{font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--ink);}
  .kv{display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px dashed var(--line);}
  .kv:last-child{border-bottom:none;}
  .kv .k{font-size:11px; color:var(--ink-dim);}
  #connlist{display:flex; flex-direction:column; gap:6px;}
  .connrow{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:9px; padding:7px 9px;
  }
  .connrow .lbl{font-size:12px; display:flex; align-items:center; gap:7px;}
  .connrow .seg{width:16px; height:2px; border-radius:2px; flex:none;}
  .connrow button{background:none; border:none; color:var(--ink-dim); cursor:pointer; font-size:15px;}
  .connrow button:hover{color:var(--danger);}
  #delDeviceBtn{
    margin-top:auto; display:flex; align-items:center; justify-content:center; gap:7px;
    background:rgba(232,96,122,.12); color:var(--danger); border:1px solid rgba(232,96,122,.35);
    padding:10px; border-radius:10px; font-weight:700; font-size:13px; cursor:pointer;
  }
  #delDeviceBtn:hover{background:rgba(232,96,122,.2);}
  .empty{font-size:12px; color:var(--ink-dim); text-align:center; padding:10px 0;}

  /* Legend */
  #legend{
    position:fixed; left:16px; bottom:16px; z-index:20; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; padding:10px 14px; display:flex; gap:16px;
  }
  .lgitem{display:flex; align-items:center; gap:7px; font-size:11px; color:var(--ink-dim);}
  .lgline{width:20px; height:0; border-top:2.5px solid; border-radius:2px;}
  .lgline.dashed{border-top-style:dashed;}

  /* Hint */
  #hint{
    position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:21;
    background:var(--panel); border:1px solid var(--line); padding:9px 16px; border-radius:20px;
    font-size:12px; color:var(--ink-dim); max-width:min(70vw,520px); text-align:center;
    transition:opacity .4s;
  }
  #hint b{color:var(--ink);}
  #hint.hide{opacity:0; pointer-events:none;}

  #toast{
    position:fixed; left:50%; top:16px; transform:translate(-50%,-140%); z-index:30;
    background:#1B2436; border:1px solid var(--line); color:var(--ink); padding:9px 16px;
    border-radius:20px; font-size:12.5px; font-weight:600; transition:transform .3s ease;
    pointer-events:none;
  }
  #toast.show{transform:translate(-50%,0);}

  @media (max-width: 760px){
    #panel{left:16px; width:auto;}
    #legend{flex-wrap:wrap; row-gap:6px;}
    .devbtn{width:52px;}
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div id="labels"></div>

<div id="toolbar">
  <div id="brand"><b>LAN 3D Simulyator</b><span>Qurilmalarni qo‘shing va tarmoqni quring</span></div>
  <div id="devtray"></div>
  <div id="actions">
    <a href="index.html" class="actbtn" id="homePortalBtn" style="color:var(--wired); border-color:rgba(111,227,196,0.35); text-decoration:none;" title="Boshqaruv portaliga qaytish">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      ATT-25 Portal
    </a>
    <button class="actbtn" id="connectModeBtn">
      <svg viewBox="0 0 24 24"><path d="M6 12h12M14 8l4 4-4 4"/></svg>
      Ulash rejimi
    </button>
    <button class="actbtn warn" id="clearBtn">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
      Tozalash
    </button>
  </div>
</div>

<aside id="panel">
  <div class="ptop">
    <div>
      <h2 id="pName">—</h2>
      <div class="type" id="pType">—</div>
    </div>
    <button class="xbtn" id="pClose">✕</button>
  </div>
  <div>
    <label>Qurilma nomi</label>
    <input type="text" id="pNameInput" maxlength="24">
  </div>
  <div>
    <div class="kv"><span class="k">IP manzil</span><span class="mono" id="pIP">—</span></div>
    <div class="kv"><span class="k">MAC manzil</span><span class="mono" id="pMAC">—</span></div>
    <div class="kv"><span class="k">Ulanishlar</span><span class="mono" id="pCount">0</span></div>
  </div>
  <div>
    <label>Ulangan qurilmalar</label>
    <div id="connlist"></div>
  </div>
  <button id="delDeviceBtn">
    <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" fill="none" stroke-width="1.8"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
    Qurilmani o‘chirish
  </button>
</aside>

<div id="legend">
  <div class="lgitem"><span class="lgline" style="border-color:#6FE3C4"></span>Simli (Ethernet)</div>
  <div class="lgitem"><span class="lgline dashed" style="border-color:#4FC7E8"></span>Simsiz (Wi‑Fi)</div>
  <div class="lgitem"><span class="lgline" style="border-color:#FF8C4B"></span>WAN (Internet)</div>
</div>

<div id="hint">Tepadagi tugmalar orqali qurilma qo‘shing → sudrab joylashtiring → <b>Ulash rejimi</b>ni yoqib ikkita qurilmani ketma-ket bosing.</div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

/* ============================= ICONS ============================= */
const ICONS = {
  router:`<svg viewBox="0 0 24 24"><rect x="3" y="12" width="18" height="7" rx="1.5"/><path d="M8 12V8a2 2 0 0 1 2-2M16 12V8a2 2 0 0 0-2-2"/><circle cx="7" cy="15.5" r="0.6" fill="var(--ink)"/><circle cx="10" cy="15.5" r="0.6" fill="var(--ink)"/><circle cx="13" cy="15.5" r="0.6" fill="var(--ink)"/></svg>`,
  modem:`<svg viewBox="0 0 24 24"><rect x="3" y="10" width="18" height="8" rx="1.5"/><path d="M12 10V6"/><circle cx="12" cy="5" r="1"/><circle cx="8" cy="14" r="0.6" fill="var(--ink)"/><circle cx="11" cy="14" r="0.6" fill="var(--ink)"/></svg>`,
  server:`<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="7" rx="1"/><rect x="5" y="14" width="14" height="7" rx="1"/><circle cx="8" cy="6.5" r="0.6" fill="var(--ink)"/><circle cx="8" cy="17.5" r="0.6" fill="var(--ink)"/></svg>`,
  desktop:`<svg viewBox="0 0 24 24"><rect x="3" y="4" width="14" height="10" rx="1"/><path d="M8 20h6M10 14v6"/><rect x="18" y="6" width="3" height="12" rx="0.5"/></svg>`,
  laptop:`<svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="9" rx="1"/><path d="M2 19h20l-2-3H4l-2 3Z"/></svg>`,
  printer:`<svg viewBox="0 0 24 24"><rect x="5" y="8" width="14" height="8" rx="1"/><path d="M7 8V4h10v4M7 16v4h10v-4"/></svg>`,
  phone:`<svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 19h2"/></svg>`
};

/* ============================= DEVICE TYPES ============================= */
const TYPES = {
  router:  {label:"Router",     color:0x3E6FA8, port:0.36, forcesWireless:false},
  modem:   {label:"Modem",      color:0x6C5B8C, port:0.30, forcesWireless:false},
  server:  {label:"Server",     color:0x2F8558, port:0.90, forcesWireless:false},
  desktop: {label:"Kompyuter",  color:0x55606E, port:0.55, forcesWireless:false},
  laptop:  {label:"Noutbuk",    color:0x7A8697, port:0.16, forcesWireless:true},
  printer: {label:"Printer",    color:0xB07A2E, port:0.34, forcesWireless:false},
  phone:   {label:"Telefon",    color:0x3E6FA8, port:0.36, forcesWireless:true},
};
const ORDER = ["router","modem","server","desktop","laptop","printer","phone"];

/* ============================= UI: build device tray ============================= */
const tray = document.getElementById('devtray');
ORDER.forEach(t=>{
  const b = document.createElement('button');
  b.className='devbtn'; b.title="Qo'shish: "+TYPES[t].label;
  b.innerHTML = ICONS[t] + `<span>${TYPES[t].label}</span>`;
  b.addEventListener('click', ()=>addDevice(t));
  tray.appendChild(b);
});

/* ============================= THREE SETUP ============================= */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.outputEncoding = THREE.sRGBEncoding;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0B0E14);
scene.fog = new THREE.Fog(0x0B0E14, 18, 42);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.1, 200);
const target = new THREE.Vector3(0,1.1,0);
let camTheta = Math.PI*0.22, camPhi = Math.PI*0.32, camRadius = 17;
function updateCamera(){
  const p = new THREE.Vector3(
    camRadius*Math.sin(camPhi)*Math.sin(camTheta),
    camRadius*Math.cos(camPhi),
    camRadius*Math.sin(camPhi)*Math.cos(camTheta)
  );
  camera.position.copy(target).add(p);
  camera.lookAt(target);
}
function onResize(){
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onResize);
onResize();
updateCamera();

/* Lights */
scene.add(new THREE.HemisphereLight(0x8FB3E0, 0x0A0E16, 0.9));
const dir = new THREE.DirectionalLight(0xffffff, 1.0);
dir.position.set(8,14,6);
scene.add(dir);
const fillLight = new THREE.PointLight(0x4FC7E8, 0.5, 30);
fillLight.position.set(-6,6,-4);
scene.add(fillLight);

/* Floor */
const FLOOR_R = 13.5;
const floorMat = new THREE.MeshStandardMaterial({color:0x0E141F, roughness:0.95, metalness:0.05});
const floor = new THREE.Mesh(new THREE.CircleGeometry(FLOOR_R, 64), floorMat);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

const grid = new THREE.GridHelper(FLOOR_R*2, 28, 0x2A3650, 0x1A2338);
grid.position.y = 0.005;
scene.add(grid);

const ringGlow = new THREE.Mesh(
  new THREE.RingGeometry(FLOOR_R-0.06, FLOOR_R, 80),
  new THREE.MeshBasicMaterial({color:0x2E4066, transparent:true, opacity:0.5, side:THREE.DoubleSide})
);
ringGlow.rotation.x = -Math.PI/2;
ringGlow.position.y = 0.01;
scene.add(ringGlow);

const floorPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);

/* ============================= HELPERS ============================= */
function mat(color, opts){ return new THREE.MeshStandardMaterial(Object.assign({color, roughness:0.45, metalness:0.35}, opts||{})); }
function emissiveMat(color, intensity){ return new THREE.MeshStandardMaterial({color, emissive:color, emissiveIntensity: intensity===undefined?1.4:intensity, roughness:0.4, metalness:0.1}); }

let idCounter = 1;
function nextId(){ return "d"+(idCounter++); }
function randHex(n){ let s=""; for(let i=0;i<n;i++) s += Math.floor(Math.random()*16).toString(16); return s; }
function macAddr(){
  const parts=[]; for(let i=0;i<6;i++) parts.push(randHex(2));
  return parts.join(":").toUpperCase();
}
let lanCounter = 2;
function nextIP(){ return "192.168.1."+(lanCounter++); }
function wanIP(){ return "91."+(20+Math.floor(Math.random()*90))+"."+Math.floor(Math.random()*255)+"."+Math.floor(Math.random()*255); }

/* ============================= DEVICE BUILDERS ============================= */
function box(w,h,d,material){ return new THREE.Mesh(new THREE.BoxGeometry(w,h,d), material); }

function buildRouter(c){
  const g = new THREE.Group();
  const body = box(1.7,0.26,1.05, mat(c));
  body.position.y = 0.15;
  g.add(body);
  [[-0.55,-0.32],[0.55,-0.32]].forEach(([x,z])=>{
    const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.03,0.55,8), mat(0x232B3A,{roughness:0.6}));
    ant.position.set(x,0.28+0.27,z);
    ant.rotation.z = x<0? 0.35 : -0.35;
    g.add(ant);
  });
  for(let i=0;i<4;i++){
    const led = new THREE.Mesh(new THREE.SphereGeometry(0.035,8,8), emissiveMat(0x6FE3C4,1.6));
    led.position.set(-0.55+i*0.35, 0.16, 0.53);
    g.add(led);
  }
  return g;
}
function buildModem(c){
  const g = new THREE.Group();
  const body = box(1.3,0.32,0.95, mat(c));
  body.position.y = 0.17;
  g.add(body);
  const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.03,0.4,8), mat(0x232B3A,{roughness:0.6}));
  ant.position.set(0.45, 0.33+0.2, -0.3);
  ant.rotation.z = -0.3;
  g.add(ant);
  for(let i=0;i<3;i++){
    const led = new THREE.Mesh(new THREE.SphereGeometry(0.032,8,8), emissiveMat(0xFF8C4B,1.5));
    led.position.set(-0.4+i*0.32, 0.18, 0.49);
    g.add(led);
  }
  return g;
}
function buildServer(c){
  const g = new THREE.Group();
  const tower = box(0.95,1.7,0.95, mat(c));
  tower.position.y = 0.85;
  g.add(tower);
  for(let i=0;i<5;i++){
    const slot = box(0.72,0.045,0.02, mat(0x1B2230,{roughness:0.8,metalness:0.1}));
    slot.position.set(0,0.35+i*0.22,0.48);
    g.add(slot);
    const led = new THREE.Mesh(new THREE.SphereGeometry(0.025,8,8), emissiveMat(i%2===0?0x6FE3C4:0xFFB454,1.7));
    led.position.set(0.3,0.35+i*0.22,0.49);
    g.add(led);
  }
  return g;
}
function buildDesktop(c){
  const g = new THREE.Group();
  const tower = box(0.42,1.0,0.42, mat(c));
  tower.position.set(0.55,0.5,0);
  g.add(tower);
  const led = new THREE.Mesh(new THREE.SphereGeometry(0.03,8,8), emissiveMat(0x6FE3C4,1.6));
  led.position.set(0.55,0.85,0.22);
  g.add(led);
  const standPole = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.35,8), mat(0x232B3A));
  standPole.position.set(-0.35,0.35,0);
  g.add(standPole);
  const standBase = new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,0.03,16), mat(0x232B3A));
  standBase.position.set(-0.35,0.18,0);
  g.add(standBase);
  const monitor = box(0.85,0.55,0.05, mat(0x151B27,{roughness:0.5,metalness:0.4}));
  monitor.position.set(-0.35,0.58,0);
  g.add(monitor);
  const screen = box(0.75,0.46,0.01, emissiveMat(c,0.7));
  screen.position.set(-0.35,0.58,0.03);
  g.add(screen);
  return g;
}
function buildLaptop(c){
  const g = new THREE.Group();
  const base = box(0.95,0.06,0.62, mat(c));
  base.position.y = 0.06;
  g.add(base);
  const hinge = new THREE.Group();
  hinge.position.set(0,0.09,-0.30);
  const screen = box(0.95,0.6,0.035, mat(0x151B27,{roughness:0.5,metalness:0.4}));
  screen.position.set(0,0.30,-0.01);
  screen.rotation.x = -0.35;
  hinge.add(screen);
  const disp = box(0.83,0.48,0.01, emissiveMat(c,0.65));
  disp.position.set(0,0.315,0.01);
  disp.rotation.x = -0.35;
  hinge.add(disp);
  g.add(hinge);
  return g;
}
function buildPrinter(c){
  const g = new THREE.Group();
  const body = box(0.95,0.5,0.72, mat(c));
  body.position.y = 0.28;
  g.add(body);
  const tray = box(0.65,0.05,0.5, mat(0x232B3A));
  tray.position.set(0,0.56,-0.05);
  g.add(tray);
  const slot = box(0.7,0.02,0.03, mat(0x0E141F));
  slot.position.set(0,0.35,0.37);
  g.add(slot);
  const led = new THREE.Mesh(new THREE.SphereGeometry(0.03,8,8), emissiveMat(0xB07A2E,1.6));
  led.position.set(0.35,0.4,0.37);
  g.add(led);
  return g;
}
function buildPhone(c){
  const g = new THREE.Group();
  const standBase = new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.16,0.03,16), mat(0x232B3A));
  standBase.position.y = 0.015;
  g.add(standBase);
  const body = box(0.26,0.55,0.03, mat(0x151B27,{roughness:0.4,metalness:0.5}));
  body.position.set(0,0.32,0);
  body.rotation.x = -0.18;
  g.add(body);
  const screen = box(0.21,0.47,0.01, emissiveMat(c,0.7));
  screen.position.set(0,0.325,0.018);
  screen.rotation.x = -0.18;
  g.add(screen);
  return g;
}
const BUILDERS = {router:buildRouter, modem:buildModem, server:buildServer, desktop:buildDesktop, laptop:buildLaptop, printer:buildPrinter, phone:buildPhone};

/* ============================= STATE ============================= */
const devices = new Map();     // id -> {id,type,group,name,ip,mac,port,pickMeshes:[]}
const connections = new Map(); // id -> {id,a,b,wireless,wan,mesh,hitMesh,packets,curveFn}
let connCounter = 1;

/* selection ring */
const selRing = new THREE.Mesh(new THREE.RingGeometry(0.5,0.6,40), new THREE.MeshBasicMaterial({color:0xFFB454, transparent:true, opacity:0.9, side:THREE.DoubleSide}));
selRing.rotation.x = -Math.PI/2; selRing.visible = false;
scene.add(selRing);
const linkRing = new THREE.Mesh(new THREE.RingGeometry(0.5,0.6,40), new THREE.MeshBasicMaterial({color:0x4FC7E8, transparent:true, opacity:0.9, side:THREE.DoubleSide}));
linkRing.rotation.x = -Math.PI/2; linkRing.visible = false;
scene.add(linkRing);

let selectedDeviceId = null;
let connectFirstId = null;
let connectMode = false;

/* wifi pulse rings from routers */
const wifiPulses = [];

/* ============================= SPAWN PLACEMENT ============================= */
function spawnPosition(){
  const n = devices.size;
  const ring = Math.floor(n/8);
  const idx = n % 8;
  const radius = 2.6 + ring*2.6;
  const angle = (idx/8)*Math.PI*2 + ring*0.35;
  return new THREE.Vector3(Math.cos(angle)*radius, 0, Math.sin(angle)*radius);
}

/* ============================= ADD / REMOVE DEVICE ============================= */
function addDevice(type){
  if(devices.size >= 26){ toast("Ko'p qurilma qo'shildi — birinchi tozalab qayta boshlang."); return; }
  const def = TYPES[type];
  const group = BUILDERS[type](def.color);
  const pos = spawnPosition();
  group.position.copy(pos);
  const id = nextId();

  const pickMeshes = [];
  group.traverse(o=>{ if(o.isMesh){ o.userData.deviceId = id; pickMeshes.push(o); } });

  // generous invisible hitbox so grabbing the device is forgiving, not pixel-perfect
  const hitBox = new THREE.Mesh(new THREE.BoxGeometry(2.0, 2.6, 2.0), new THREE.MeshBasicMaterial({visible:false}));
  hitBox.position.y = 1.0;
  hitBox.userData.deviceId = id;
  group.add(hitBox);
  pickMeshes.push(hitBox);

  scene.add(group);

  const nameCount = [...devices.values()].filter(d=>d.type===type).length + 1;
  const rec = {
    id, type, group, pickMeshes,
    name: def.label+" "+nameCount,
    ip: type==="modem" ? wanIP() : nextIP(),
    mac: macAddr(),
    port: def.port,
  };
  devices.set(id, rec);

  const label = document.createElement('div');
  label.className = 'devlabel';
  label.innerHTML = `<span class="dot" style="background:#${def.color.toString(16).padStart(6,'0')}"></span><span class="nm">${rec.name}</span><span class="ip">${rec.ip}</span>`;
  labelsEl.appendChild(label);
  rec.label = label;

  toast((def.label)+" qo'shildi");
  return rec;
}

function removeConnection(cid){
  const c = connections.get(cid);
  if(!c) return;
  scene.remove(c.mesh);
  if(c.hitMesh) scene.remove(c.hitMesh);
  c.mesh.geometry.dispose();
  if(c.hitMesh) c.hitMesh.geometry.dispose();
  connections.delete(cid);
}

function removeDevice(id){
  const rec = devices.get(id);
  if(!rec) return;
  [...connections.values()].filter(c=>c.a===id||c.b===id).forEach(c=>removeConnection(c.id));
  scene.remove(rec.group);
  rec.label.remove();
  devices.delete(id);
  if(selectedDeviceId===id){ selectedDeviceId=null; selRing.visible=false; closePanel(); }
  if(connectFirstId===id){ connectFirstId=null; linkRing.visible=false; }
}

/* ============================= CONNECTIONS ============================= */
function connExists(a,b){
  for(const c of connections.values()) if((c.a===a&&c.b===b)||(c.a===b&&c.b===a)) return true;
  return false;
}
function makeCurveFn(a,b,sag){
  return function(){
    const ra = devices.get(a), rb = devices.get(b);
    if(!ra||!rb) return null;
    const p1 = ra.group.position.clone(); p1.y += ra.port;
    const p2 = rb.group.position.clone(); p2.y += rb.port;
    const mid = p1.clone().add(p2).multiplyScalar(0.5);
    mid.y += sag;
    return new THREE.QuadraticBezierCurve3(p1, mid, p2);
  };
}

function addConnection(a,b){
  if(a===b || connExists(a,b)) return;
  const ra = devices.get(a), rb = devices.get(b);
  const wan = (ra.type==="router"&&rb.type==="modem")||(ra.type==="modem"&&rb.type==="router");
  const wireless = !wan && (TYPES[ra.type].forcesWireless || TYPES[rb.type].forcesWireless);
  const dist = ra.group.position.distanceTo(rb.group.position);
  const sag = wireless ? Math.min(dist*0.22, 1.4) : -Math.min(dist*0.12, 0.8);

  const id = "c"+(connCounter++);
  const curveFn = makeCurveFn(a,b,sag);
  let curve = curveFn();

  let mesh, hitMesh=null;
  const color = wan?0xFF8C4B : wireless?0x4FC7E8:0x6FE3C4;

  if(wireless){
    const pts = curve.getPoints(40);
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    const lmat = new THREE.LineDashedMaterial({color, dashSize:0.22, gapSize:0.14, linewidth:1, transparent:true, opacity:0.85});
    mesh = new THREE.Line(geo, lmat);
    mesh.computeLineDistances();
  } else {
    const geo = new THREE.TubeGeometry(curve, 24, wan?0.05:0.035, 8, false);
    mesh = new THREE.Mesh(geo, mat(color, {roughness:0.5, metalness:0.2, emissive:color, emissiveIntensity:0.12}));
    const hitGeo = new THREE.TubeGeometry(curve, 24, 0.16, 8, false);
    hitMesh = new THREE.Mesh(hitGeo, new THREE.MeshBasicMaterial({visible:false}));
    hitMesh.userData.connectionId = id;
    scene.add(hitMesh);
  }
  scene.add(mesh);

  const packets = [];
  const pn = wan?2:1;
  for(let i=0;i<pn;i++) packets.push({t: Math.random(), speed: 0.12+Math.random()*0.1, mesh:null});

  connections.set(id, {id,a,b,wireless,wan,mesh,hitMesh,packets,curveFn,sag,color});
  toast((wan?"WAN":wireless?"Wi-Fi":"Ethernet")+" ulanish yaratildi: "+ra.name+" ↔ "+rb.name);
}

/* connection packet visual pool */
const packetPool = [];
function getPacketMesh(color){
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.06,10,10), emissiveMat(color,2.0));
  scene.add(m);
  return m;
}

/* ============================= LABELS DOM ============================= */
const labelsEl = document.getElementById('labels');

/* ============================= INTERACTION ============================= */
const raycaster = new THREE.Raycaster();
const mouseNDC = new THREE.Vector2();

let dragDeviceId = null, dragMoved = false, dragStart = {x:0,y:0};
let orbiting = false, lastX=0, lastY=0;

function setMouse(e){
  const r = canvas.getBoundingClientRect();
  mouseNDC.x = ((e.clientX-r.left)/r.width)*2-1;
  mouseNDC.y = -((e.clientY-r.top)/r.height)*2+1;
}

function pickDevice(){
  raycaster.setFromCamera(mouseNDC, camera);
  const meshes = [];
  devices.forEach(d=>meshes.push(...d.pickMeshes));
  const hits = raycaster.intersectObjects(meshes, false);
  if(hits.length) return hits[0].object.userData.deviceId;
  return null;
}
function pickConnection(){
  raycaster.setFromCamera(mouseNDC, camera);
  const meshes = [];
  connections.forEach(c=>{ if(c.hitMesh) meshes.push(c.hitMesh); });
  const hits = raycaster.intersectObjects(meshes, false);
  if(hits.length) return hits[0].object.userData.connectionId;
  return null;
}
function floorPoint(){
  raycaster.setFromCamera(mouseNDC, camera);
  const pt = new THREE.Vector3();
  const hit = raycaster.ray.intersectPlane(floorPlane, pt);
  return hit ? pt : null;
}

canvas.addEventListener('pointerdown', (e)=>{
  setMouse(e);
  hideHint();
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  const devId = pickDevice();

  if(devId){
    if(connectMode){
      handleConnectClick(devId);
      return;
    }
    dragDeviceId = devId;
    dragMoved = false;
    dragStart.x = e.clientX; dragStart.y = e.clientY;
    return;
  }

  if(!connectMode){
    const cid = pickConnection();
    if(cid){ selectConnectionPrompt(cid); return; }
  }

  orbiting = true; lastX = e.clientX; lastY = e.clientY;
});

canvas.addEventListener('pointermove', (e)=>{
  e.preventDefault();
  setMouse(e);
  if(dragDeviceId){
    const dx = e.clientX-dragStart.x, dy = e.clientY-dragStart.y;
    if(Math.hypot(dx,dy) > 4) dragMoved = true;
    if(dragMoved){
      const pt = floorPoint();
      if(pt){
        const rec = devices.get(dragDeviceId);
        const len = Math.hypot(pt.x, pt.z);
        const maxR = FLOOR_R-0.6;
        if(len > maxR){ pt.x *= maxR/len; pt.z *= maxR/len; }
        rec.group.position.x = pt.x;
        rec.group.position.z = pt.z;
      }
    }
    return;
  }
  if(orbiting){
    const dx = e.clientX-lastX, dy = e.clientY-lastY;
    lastX = e.clientX; lastY = e.clientY;
    camTheta -= dx*0.006;
    camPhi   -= dy*0.006;
    camPhi = Math.max(0.18, Math.min(Math.PI/2-0.05, camPhi));
    updateCamera();
  }
});

window.addEventListener('pointerup', (e)=>{
  try{ canvas.releasePointerCapture(e.pointerId); }catch(err){}
  if(dragDeviceId && !dragMoved){
    selectDevice(dragDeviceId);
  }
  dragDeviceId = null; dragMoved = false;
  orbiting = false;
});

canvas.addEventListener('wheel', (e)=>{
  e.preventDefault();
  camRadius += e.deltaY*0.01;
  camRadius = Math.max(6, Math.min(30, camRadius));
  updateCamera();
}, {passive:false});

/* connect mode logic */
function handleConnectClick(devId){
  if(connectFirstId===null){
    connectFirstId = devId;
    linkRing.visible = true;
    toast("Endi ikkinchi qurilmani tanlang: "+devices.get(devId).name);
  } else if(connectFirstId===devId){
    connectFirstId = null;
    linkRing.visible = false;
  } else {
    addConnection(connectFirstId, devId);
    connectFirstId = null;
    linkRing.visible = false;
  }
}

function selectConnectionPrompt(cid){
  const c = connections.get(cid);
  const ra = devices.get(c.a), rb = devices.get(c.b);
  if(!ra||!rb) return;
  if(confirm("Aloqani o'chirilsinmi?\n"+ra.name+" ↔ "+rb.name)){
    removeConnection(cid);
    toast("Ulanish o'chirildi");
  }
}

/* ============================= UI: connect mode / clear ============================= */
const connectBtn = document.getElementById('connectModeBtn');
connectBtn.addEventListener('click', ()=>{
  connectMode = !connectMode;
  connectBtn.classList.toggle('on', connectMode);
  connectFirstId = null; linkRing.visible = false;
  toast(connectMode ? "Ulash rejimi yoqildi — ikkita qurilmani ketma-ket bosing" : "Ulash rejimi o'chirildi");
});
document.getElementById('clearBtn').addEventListener('click', ()=>{
  if(devices.size===0) return;
  if(!confirm("Butun tarmoq tozalansinmi?")) return;
  [...devices.keys()].forEach(removeDevice);
  toast("Tarmoq tozalandi");
});

/* ============================= PANEL ============================= */
const panel = document.getElementById('panel');
const pName = document.getElementById('pName');
const pType = document.getElementById('pType');
const pNameInput = document.getElementById('pNameInput');
const pIP = document.getElementById('pIP');
const pMAC = document.getElementById('pMAC');
const pCount = document.getElementById('pCount');
const connlist = document.getElementById('connlist');

function selectDevice(id){
  selectedDeviceId = id;
  selRing.visible = true;
  openPanel();
  refreshPanel();
}
function closePanel(){
  panel.classList.remove('show');
  selRing.visible = false;
  selectedDeviceId = null;
}
function openPanel(){ panel.classList.add('show'); }
document.getElementById('pClose').addEventListener('click', closePanel);

pNameInput.addEventListener('input', ()=>{
  const rec = devices.get(selectedDeviceId);
  if(!rec) return;
  rec.name = pNameInput.value || rec.name;
  pName.textContent = rec.name;
  rec.label.querySelector('.nm').textContent = rec.name;
  refreshConnList();
});

document.getElementById('delDeviceBtn').addEventListener('click', ()=>{
  if(!selectedDeviceId) return;
  const rec = devices.get(selectedDeviceId);
  if(confirm("O'chirilsinmi: "+rec.name+"?")){
    removeDevice(selectedDeviceId);
  }
});

function refreshPanel(){
  const rec = devices.get(selectedDeviceId);
  if(!rec) return;
  pName.textContent = rec.name;
  pType.textContent = TYPES[rec.type].label + (rec.type==="modem" ? " · Tashqi IP" : "");
  pNameInput.value = rec.name;
  pIP.textContent = rec.ip;
  pMAC.textContent = rec.mac;
  refreshConnList();
}
function refreshConnList(){
  const rec = devices.get(selectedDeviceId);
  if(!rec) return;
  const list = [...connections.values()].filter(c=>c.a===rec.id||c.b===rec.id);
  pCount.textContent = list.length;
  connlist.innerHTML = "";
  if(list.length===0){
    connlist.innerHTML = `<div class="empty">Hali ulanish yo'q</div>`;
    return;
  }
  list.forEach(c=>{
    const otherId = c.a===rec.id?c.b:c.a;
    const other = devices.get(otherId);
    if(!other) return;
    const row = document.createElement('div');
    row.className='connrow';
    const colorHex = "#"+c.color.toString(16).padStart(6,'0');
    row.innerHTML = `<span class="lbl"><span class="seg" style="background:${colorHex}"></span>${other.name}</span>`;
    const btn = document.createElement('button');
    btn.textContent = '✕';
    btn.title = "Ulanishni o'chirish";
    btn.addEventListener('click', ()=>{ removeConnection(c.id); refreshConnList(); });
    row.appendChild(btn);
    connlist.appendChild(row);
  });
}

/* ============================= TOAST / HINT ============================= */
const toastEl = document.getElementById('toast');
let toastTimer=null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 2200);
}
const hintEl = document.getElementById('hint');
let hinted=false;
function hideHint(){ if(!hinted){ hinted=true; hintEl.classList.add('hide'); } }

/* ============================= RESIZE ============================= */
function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onResize);
onResize();

/* ============================= ANIMATION LOOP ============================= */
const clock = new THREE.Clock();
const tmpV = new THREE.Vector3();

function updateConnectionsGeometry(){
  connections.forEach(c=>{
    const curve = c.curveFn();
    if(!curve) return;
    if(c.wireless){
      const pts = curve.getPoints(40);
      c.mesh.geometry.setFromPoints(pts);
      c.mesh.computeLineDistances();
      c.mesh.geometry.attributes.position.needsUpdate = true;
    } else {
      c.mesh.geometry.dispose();
      c.mesh.geometry = new THREE.TubeGeometry(curve, 24, c.wan?0.05:0.035, 8, false);
      if(c.hitMesh){
        c.hitMesh.geometry.dispose();
        c.hitMesh.geometry = new THREE.TubeGeometry(curve, 24, 0.16, 8, false);
      }
    }
  });
}

function updateLabels(){
  devices.forEach(rec=>{
    tmpV.copy(rec.group.position);
    tmpV.y += rec.port*2 + 0.55;
    tmpV.project(camera);
    if(tmpV.z>1){ rec.label.style.display='none'; return; }
    const x = (tmpV.x*0.5+0.5)*window.innerWidth;
    const y = (-tmpV.y*0.5+0.5)*window.innerHeight;
    rec.label.style.display='flex';
    rec.label.style.left = x+"px";
    rec.label.style.top = y+"px";
  });
}

function updateRings(){
  if(selRing.visible && selectedDeviceId){
    const rec = devices.get(selectedDeviceId);
    if(rec){ selRing.position.set(rec.group.position.x,0.02,rec.group.position.z); }
  }
  if(linkRing.visible && connectFirstId){
    const rec = devices.get(connectFirstId);
    if(rec){ linkRing.position.set(rec.group.position.x,0.02,rec.group.position.z); }
  }
  const t = clock.elapsedTime;
  selRing.scale.setScalar(1+Math.sin(t*3)*0.06);
  linkRing.scale.setScalar(1+Math.sin(t*4)*0.08);
}

function updatePackets(dt){
  connections.forEach(c=>{
    const curve = c.curveFn();
    if(!curve) return;
    c.packets.forEach(p=>{
      p.t += dt*p.speed;
      if(p.t>1) p.t -= 1;
      if(!p.mesh) p.mesh = getPacketMesh(c.color);
      const pos = curve.getPointAt(Math.min(Math.max(p.t,0),1));
      p.mesh.position.copy(pos);
      const pulse = 0.85+Math.sin(clock.elapsedTime*6+p.t*10)*0.15;
      p.mesh.scale.setScalar(pulse);
    });
  });
}

function updateWifiPulses(dt){
  // spawn periodically from routers/modems
  wifiPulses.forEach(w=>{ w.t += dt; });
  for(let i=wifiPulses.length-1;i>=0;i--){
    const w = wifiPulses[i];
    const k = w.t/1.6;
    if(k>=1){ scene.remove(w.mesh); w.mesh.geometry.dispose(); wifiPulses.splice(i,1); continue; }
    w.mesh.scale.setScalar(0.3+k*2.2);
    w.mesh.material.opacity = 0.5*(1-k);
  }
}
let wifiSpawnTimer=0;
function spawnWifiPulses(dt){
  wifiSpawnTimer += dt;
  if(wifiSpawnTimer < 1.6) return;
  wifiSpawnTimer = 0;
  devices.forEach(rec=>{
    if(rec.type!=="router") return;
    const hasWireless = [...connections.values()].some(c=>(c.a===rec.id||c.b===rec.id)&&c.wireless);
    if(!hasWireless) return;
    const geo = new THREE.RingGeometry(0.35,0.42,32);
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color:0x4FC7E8, transparent:true, opacity:0.5, side:THREE.DoubleSide}));
    m.rotation.x = -Math.PI/2;
    m.position.set(rec.group.position.x, 0.05, rec.group.position.z);
    scene.add(m);
    wifiPulses.push({mesh:m, t:0});
  });
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  updateConnectionsGeometry();
  updatePackets(dt);
  updateLabels();
  updateRings();
  spawnWifiPulses(dt);
  updateWifiPulses(dt);
  renderer.render(scene, camera);
}

/* ============================= SEED NETWORK ============================= */
function seed(){
  const modem = addDevice('modem'); modem.group.position.set(0,0,-4.2);
  const router = addDevice('router'); router.group.position.set(0,0,-1.6);
  addConnection(modem.id, router.id);

  const server = addDevice('server'); server.group.position.set(-3.4,0,1.6);
  addConnection(router.id, server.id);

  const desktop = addDevice('desktop'); desktop.group.position.set(3.2,0,1.2);
  addConnection(router.id, desktop.id);

  const laptop = addDevice('laptop'); laptop.group.position.set(1.2,0,3.6);
  addConnection(router.id, laptop.id);

  const phone = addDevice('phone'); phone.group.position.set(-1.6,0,3.8);
  addConnection(router.id, phone.id);
}
seed();
animate();

})();
